# docker/mcp-gateway — aggregates trace-mcp with a hard tool allowlist.
# ConfigMap + --servers: see gateway/configmap.yaml and patches/gateway-servers.yaml
# (regenerated by apply-workspace.ps1 when secondaries register).
apiVersion: v1
kind: Namespace
metadata:
  name: project-localdepot-dev
  labels:
    app.kubernetes.io/part-of: localdepot
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: docker-mcp-gateway
  namespace: project-localdepot-dev
  labels:
    app.kubernetes.io/name: docker-mcp-gateway
    app.kubernetes.io/part-of: localdepot
    app.kubernetes.io/component: mcp-gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: docker-mcp-gateway
  template:
    metadata:
      labels:
        app.kubernetes.io/name: docker-mcp-gateway
        app.kubernetes.io/part-of: localdepot
        app.kubernetes.io/component: mcp-gateway
    spec:
      containers:
        - name: gateway
          image: docker/mcp-gateway:latest
          imagePullPolicy: IfNotPresent
          args:
            - --catalog=/root/.docker/mcp/catalogs/localdepot.yaml
            - --servers=trace-mcp
            - --tools-config=/root/.docker/mcp/tools.yaml
            - --transport=streaming
            - --port=8080
            - --host=0.0.0.0
            - --allow-unauthenticated
            - --verify-signatures=false
            - --verbose
          env:
            - name: DOCKER_MCP_IN_CONTAINER
              value: "1"
            - name: DOCKER_MCP_ALLOW_INSECURE_REMOTE_URLS
              value: "1"
          ports:
            - name: mcp
              containerPort: 8080
          volumeMounts:
            - name: docker-sock
              mountPath: /var/run/docker.sock
            - name: catalogs
              mountPath: /root/.docker/mcp/catalogs
            - name: tools
              mountPath: /root/.docker/mcp/tools.yaml
              subPath: tools.yaml
          readinessProbe:
            tcpSocket:
              port: mcp
            initialDelaySeconds: 8
            periodSeconds: 5
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
      volumes:
        - name: docker-sock
          hostPath:
            path: /var/run/docker.sock
            type: Socket
        - name: catalogs
          configMap:
            name: docker-mcp-gateway-config
            items:
              - key: catalog-localdepot.yaml
                path: localdepot.yaml
        - name: tools
          configMap:
            name: docker-mcp-gateway-config
            items:
              - key: tools.yaml
                path: tools.yaml
---
apiVersion: v1
kind: Service
metadata:
  name: docker-mcp-gateway
  namespace: project-localdepot-dev
  labels:
    app.kubernetes.io/name: docker-mcp-gateway
    app.kubernetes.io/part-of: localdepot
spec:
  selector:
    app.kubernetes.io/name: docker-mcp-gateway
  ports:
    - name: mcp
      port: 8080
      targetPort: 8080
