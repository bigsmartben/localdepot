# Regenerated by apply-workspace.ps1 -Instance mcpverify. Single unified remote.
# No ?project= on catalog URL: multi-repo mounts hang on parent path; clients scope via mcp.json projects.
apiVersion: v1
kind: ConfigMap
metadata:
  name: docker-mcp-gateway-config
  namespace: project-mcpverify-dev
  labels:
    app.kubernetes.io/name: docker-mcp-gateway
    app.kubernetes.io/part-of: mcpverify
data:
  catalog-localdepot.yaml: |
    registry:
      trace-mcp:
        name: trace-mcp
        title: trace-mcp
        description: Unified codebase remote (all repos under mounted workspace root).
        type: remote
        remote:
          transport_type: streamable-http
          url: http://trace-mcp.project-mcpverify-dev.svc.cluster.local:3741/mcp
  tools.yaml: |
    trace-mcp:
      - search
      - get_outline
      - get_symbol
      - find_usages
      - get_change_impact
      - get_task_context
      - get_call_graph
      - get_project_map
      - load_tools
      - get_preset_info
