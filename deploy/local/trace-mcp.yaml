# trace-mcp — code intelligence backend for the local verification runtime.
# Mounts the localdepot workspace (mode A hostPath). Gateway proxies via type:remote.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: trace-mcp
  namespace: project-localdepot-dev
  labels:
    app.kubernetes.io/name: trace-mcp
    app.kubernetes.io/part-of: localdepot
    app.kubernetes.io/component: mcp-backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: trace-mcp
  template:
    metadata:
      labels:
        app.kubernetes.io/name: trace-mcp
        app.kubernetes.io/part-of: localdepot
        app.kubernetes.io/component: mcp-backend
    spec:
      containers:
        - name: trace-mcp
          image: localdepot/trace-mcp:3.31.3
          imagePullPolicy: IfNotPresent
          env:
            - name: TRACE_PROJECT_ROOT
              value: /workspaces/project
            - name: TRACE_HOME
              value: /workspaces/project/.cache/trace-home
            - name: TRACE_MCP_TELEMETRY
              value: "off"
          ports:
            - name: mcp
              containerPort: 3741
          readinessProbe:
            tcpSocket:
              port: mcp
            initialDelaySeconds: 15
            periodSeconds: 10
            failureThreshold: 30
          livenessProbe:
            tcpSocket:
              port: mcp
            initialDelaySeconds: 60
            periodSeconds: 30
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 3Gi
          volumeMounts:
            - name: workspace
              mountPath: /workspaces/project
      volumes:
        - name: workspace
          hostPath:
            # Placeholder — real path comes from patches/hostpath.yaml via kustomize
            # or .\apply-workspace.ps1 (formula: host-mount-windows.md). Never put C:\ here.
            path: /mnt/c/_SET_VIA_apply-workspace_
            type: Directory
---
apiVersion: v1
kind: Service
metadata:
  name: trace-mcp
  namespace: project-localdepot-dev
  labels:
    app.kubernetes.io/name: trace-mcp
    app.kubernetes.io/part-of: localdepot
spec:
  selector:
    app.kubernetes.io/name: trace-mcp
  ports:
    - name: mcp
      port: 3741
      targetPort: 3741
